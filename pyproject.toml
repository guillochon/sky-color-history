[project]
name = "sky-color-history"
version = "0.1.0"
description = "A spectral radiative-transfer reconstruction of Earth's sky color through time"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "websockets>=17.2",
    "torch>=2.9",
]

[tool.uv]
package = false

# The multiple-scattering tables (model/skymodel.py ms_table) run on the GPU when torch has CUDA.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
